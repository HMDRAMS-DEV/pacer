name: Pacer
options:
  bundleIdPrefix: dev.pacer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Pacer:
    type: application
    platform: macOS
    sources: [Pacer]
    info:
      path: Pacer/Info.plist
      properties:
        CFBundleDisplayName: Pacer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pacer.Pacer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  PacerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PacerTests]
    dependencies:
      - target: Pacer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Pacer:
    build:
      targets:
        Pacer: all
    test:
      targets: [PacerTests]
